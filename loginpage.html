<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECE Portal - Secure Login</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', 'Inter', -apple-system, sans-serif;
      background-color: #111111;
      background-image:
        radial-gradient(ellipse at 50% 45%, rgba(44, 44, 44, 0) 0%, rgba(17, 17, 17, 0) 72%),
        url('background.png');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================
       THE INVISIBLE BOX LAYOUT
    ============================================ */
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      background: transparent; 
      border: none;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Orange Bracket Accents */
    .aesthetic-corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: #f97316;
      border-style: solid;
      opacity: 0.8;
    }
    .tl { top: 0; left: 0; border-width: 2px 0 0 2px; }
    .tr { top: 0; right: 0; border-width: 2px 2px 0 0; }
    .bl { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
    .br { bottom: 0; right: 0; border-width: 0 2px 2px 0; }

    /* ============================================
       TYPOGRAPHY
    ============================================ */
    .brand-logo {
      font-family: 'Poppins', sans-serif;
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #ffffff;
      margin-bottom: 4px;
      text-transform: uppercase;
      margin-top: 20px;
    }

    .brand-logo span {
      color: #f97316;
    }

    .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #999999;
      margin-bottom: 40px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
    }

    /* ============================================
       FORM & INPUTS
    ============================================ */
    #loginForm {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: #bbbbbb;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-group input {
      font-family: 'Inter', sans-serif;
      background-color: #161616;
      border: 1px solid #333333;
      color: #ffffff;
      padding: 14px 16px;
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.2s ease;
      width: 100%;
    }

    .input-group input:focus {
      outline: none;
      border-color: #f97316;
      box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.15);
    }

    .input-group input::placeholder {
      color: #555555;
    }

    /* ── PASSWORD WRAPPER ── */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    
    .password-wrapper input {
      padding-right: 60px; /* Make room for the toggle button */
    }
    
    .toggle-password {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: #888888;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0;
    }
    
    .toggle-password:hover {
      color: #f97316;
    }

    /* ============================================
       BUTTON & REGISTRATION LINK STYLING
    ============================================ */
    .submit-btn {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background-color: #f97316;
      padding: 15px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      margin-top: 8px;
      width: 100%;
    }

    .submit-btn:hover {
      background-color: #ea6c0e;
    }

    .submit-btn:active {
      transform: translateY(1px);
    }

    .register-prompt {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #888888;
      text-align: center;
      margin-top: 4px;
    }

    .register-prompt a {
      color: #f97316;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease, text-decoration 0.2s ease;
    }

    .register-prompt a:hover {
      color: #ea6c0e;
      text-decoration: underline;
    }

    .back-link {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: #777777;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: #f97316;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="aesthetic-corner tl"></div>
    <div class="aesthetic-corner tr"></div>
    <div class="aesthetic-corner bl"></div>
    <div class="aesthetic-corner br"></div>

    <div class="brand-logo">ECE<span>.</span></div>
    <div class="subtitle">Student Portal</div>

    <form id="loginForm">
      <div class="input-group">
        <label for="username">ID Number / Username</label>
        <input type="text" id="username" placeholder="e.g. AE202406767" autocomplete="off" required>
      </div>
      
      <div class="input-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="••••••••" required>
          <button type="button" id="togglePassword" class="toggle-password" tabindex="-1">Show</button>
        </div>
      </div>
      
      <button type="submit" class="submit-btn" id="loginBtn">Login</button>
      
      <div class="register-prompt">
        Don't have an account? <a href="registration.html">Register here</a>
      </div>
    </form>

    <a href="index.html" class="back-link">← Return to Homepage</a>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      "https://xxzbuhvilxapebzzkmla.supabase.co", 
      "sb_publishable_Bp2vcEqzfxnGDhfrm_0Nqw_ipJ79QDb"
    );

    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");

    // Toggle Password Visibility Logic
    const togglePasswordBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    
    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      togglePasswordBtn.textContent = isPassword ? 'Hide' : 'Show';
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";

      let usernameInput = document.getElementById("username").value.trim().toLowerCase();
      const password = document.getElementById("password").value.trim();

      // Clean input in case they typed an @ symbol
      if (usernameInput.includes('@')) {
        usernameInput = usernameInput.split('@')[0];
      }
      
      // Use identical synthetic dummy email domain
      const syntheticEmail = `${usernameInput}@ece.student.local`;

      const { data, error } = await supabase.auth.signInWithPassword({
        email: syntheticEmail,
        password: password,
      });

      if (error) {
        alert("Login failed: " + error.message);
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
        return;
      }

      localStorage.setItem("user", JSON.stringify(data.user));

      try {
        const { data: profile, error: profileError } = await supabase
          .from('profiles')
          .select('role')
          .eq('id', data.user.id)
          .maybeSingle();

        if (profileError) throw profileError;

        // Standardize the text role checking (lowercase + trimmed)
        const role = (profile && profile.role) ? profile.role.toLowerCase().trim() : 'student';

        if (role === 'admin') {
          window.location.href = "adminpage.html";
        } else if (role === 'adminstudent') {
          window.location.href = "adpagestudent.html";
        } else {
          // Both 'student' and any unmapped fallback roles land on dashboard
          window.location.href = "dashboard.html";
        }

      } catch (profileError) {
        console.error("Error checking role routing:", profileError);
        // Clean routing fallback if table fetch fails
        window.location.href = "dashboard.html";
      }
    });
  </script>
</body>
</html>
