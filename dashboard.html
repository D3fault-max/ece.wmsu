<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECE Student Portal - Dashboard</title>
  <style>
    @font-face { font-family: 'Plateia'; src: url('Plateia Bold.ttf') format('truetype'); font-weight: normal; font-style: normal; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', 'Inter', -apple-system, sans-serif; background-color: #111111; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    /* NAVBAR */
    .navbar { display: flex; align-items: center;
      padding: 14px 5%;
      background-color: #ffffff; 
      position: sticky; top: 0; z-index: 1000; 
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08); 
    }
    .logo-area { flex: 1; 
      display: flex; align-items: center; 
    }
    .logo { font-family: 'Plateia', sans-serif; 
    font-size: 26px; font-weight: 900; letter-spacing: 3px; 
    text-transform: uppercase; 
    color: #000000; 
    cursor: pointer; 
    }
    .nav-center { flex: 2;
      display: flex; 
      justify-content: center;
    }
    .nav-links { display: flex; 
      list-style: none; 
      gap: 36px; 
    }
    .nav-links a { font-family: 'Inter', sans-serif; 
    text-decoration: none; color: #333333; 
    font-size: 15px; font-weight: 500; 
    position: relative; padding: 4px 0; 
    transition: color 0.2s ease; 
    }
    .nav-links a::after { content: ''; 
    position: absolute; 
    bottom: 0; 
    left: 0; 
    width: 0; 
    height: 2px; 
    background-color: #f97316; 
    transition: width 0.3s ease; 
  }
    .nav-links a:hover,
    .nav-links a.active { color: #f97316; }
    .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
    #enrollNavItem, .mobile-only-link { display: none; }
    .nav-right { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
    .user-profile-widget { display: flex; align-items: center; gap: 10px; background-color: #f8f9fa; padding: 5px 12px 5px 6px; border-radius: 30px; border: 1px solid #eaeaea; cursor: pointer; text-decoration: none; transition: all 0.2s; }
    .user-profile-widget:hover { background-color: #f1f3f5; border-color: #dcdcdc; transform: translateY(-1px); }
    .user-profile-widget.profile-widget-disabled { pointer-events: none; opacity: 0.55; cursor: not-allowed; }
    .user-profile-widget.profile-widget-disabled:hover { background-color: #f8f9fa; border-color: #eaeaea; transform: none; }
    .avatar-circle { width: 34px; height: 34px; background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; overflow:hidden;}
    .user-meta-text { display: flex; flex-direction: column; line-height: 1.2; }
    .profile-name-string { font-size: 13px; font-weight: 600; color: #111111; }
    .badge-pill { font-family: 'Inter', sans-serif; background-color: #f97316; color: white; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; text-transform: uppercase; width: fit-content; margin-top: 2px; }
    .logout-btn { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; color: #ffffff; background-color: #f97316; padding: 10px 26px; border-radius: 6px; border: none; cursor: pointer; transition: background-color 0.2s ease; }
    .logout-btn:hover { background-color: #ea6c0e; }
    .mobile-menu-btn { display: none; background: none; border: none; cursor: pointer; padding: 5px; }
    .mobile-menu-btn svg { width: 28px; height: 28px; fill: none; stroke: #111111; stroke-width: 2; stroke-linecap: round; }

    /* LAYOUT WRAPPER */
    .dashboard-wrapper { flex: 1; width: 100%; display: block; }
    .dashboard-content { display: flex; flex-direction: column; width: 100%; }
    .hero-section { display: none; }

    /* CAROUSEL SECTION */
    .carousel-section { position: relative; background: linear-gradient(rgba(17, 17, 17, 0), rgba(17, 17, 17, 0)), url('background.png'); background-size: cover; background-position: center; min-height: calc(100vh - 64px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 55px 0 65px 0; overflow-x: hidden; }
    .corner-bracket { position: absolute; display: flex; align-items: center; justify-content: center; }
    .corner-bracket svg { width: 34px; height: 34px; fill: none; stroke: #f97316; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .corner-bracket.top-left { top: 28px; left: 44px; } .corner-bracket.top-right { top: 28px; right: 44px; }
    .corner-bracket.bottom-left { bottom: 60px; left: 44px; } .corner-bracket.bottom-right { bottom: 60px; right: 44px; }
    .carousel-wrapper { position: relative; width: 100%; max-width: 1400px; padding: 10px 0; }
    .carousel-container { position: relative; display: flex; justify-content: center; align-items: center; height: 500px; width: 100%; }
    
    .showcase-card { position: absolute; width: 340px; background-color: #ffffff; border-radius: 6px; overflow: hidden; text-decoration: none; color: inherit; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease; opacity: 0; pointer-events: none; }
    .card-corner { position: absolute; width: 9px; height: 9px; background-color: #f97316; z-index: 20; display: none; }
    .card-corner.tl { top: 8px; left: 8px; } .card-corner.tr { top: 8px; right: 8px; } .card-corner.bl { bottom: 8px; left: 8px; } .card-corner.br { bottom: 8px; right: 8px; }
    .showcase-card.active .card-corner { display: block; }
    .image-container { width: 100%; aspect-ratio: 1/1; overflow: hidden; background-color: #eeeeee; }
    .image-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
    .showcase-card:hover .image-container img { transform: scale(1.06); }
    .card-meta { padding: 20px 16px; text-align: center; background-color: #ffffff; }
    .card-meta h3 { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 500; color: #111111; margin-bottom: 4px; }
    .card-meta p { font-family: 'Inter', sans-serif; font-size: 11px; color: #999999; text-transform: uppercase; letter-spacing: 1.5px; }

    /* states */
    .showcase-card.active { transform: translateX(0) scale(1.07); opacity: 1; z-index: 10; pointer-events: auto; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65); }
    .showcase-card.prev-1 { transform: translateX(-320px) scale(0.87); opacity: 0.7; z-index: 5; pointer-events: auto; }
    .showcase-card.next-1 { transform: translateX(320px) scale(0.87); opacity: 0.7; z-index: 5; pointer-events: auto; }
    .showcase-card.prev-2 { transform: translateX(-595px) scale(0.7); opacity: 0.28; z-index: 2; }
    .showcase-card.next-2 { transform: translateX(595px) scale(0.7); opacity: 0.28; z-index: 2; }
    
    .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; z-index: 100; padding: 12px; opacity: 0.45; transition: opacity 0.2s ease; }
    .carousel-btn:hover { opacity: 1; }
    .carousel-btn svg { width: 36px; height: 36px; fill: none; stroke: #f97316; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .left-btn { left: 3%; } .right-btn { right: 3%; }

    .carousel-dots { display: flex; justify-content: center; gap: 10px; margin-top: 32px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background-color: rgba(255, 255, 255, 0.22); cursor: pointer; border: none; transition: background-color 0.3s, transform 0.3s; }
    .dot.active { background-color: #f97316; transform: scale(1.28); }
    .dot:hover:not(.active) { background-color: rgba(255, 255, 255, 0.5); }

    /* FOOTER */
    .site-footer { background-color: #161616; border-top: 1px solid #222222; padding: 40px 5%; font-family: 'Inter', sans-serif; }
    .footer-content { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px; max-width: 1400px; margin: 0 auto; }
    .footer-left .footer-logo { font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 900; letter-spacing: 2px; color: #f97316; margin-bottom: 4px; }
    .footer-left p { font-size: 13px; color: #666666; }
    .footer-right { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
    .footer-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: #f97316; }
    .footer-links { display: flex; gap: 24px; align-items: center; }
    .footer-link { display: flex; align-items: center; gap: 8px; color: #cccccc; text-decoration: none; font-size: 14px; transition: color 0.2s ease; }
    .footer-link:hover { color: #f97316; }
    .footer-link svg { width: 18px; height: 18px; fill: currentColor; }

    /* RESPONSIVE */
    @media (max-width: 1024px) {
      .carousel-container { height: 420px; } .showcase-card { width: 280px; }
      .showcase-card.prev-1 { transform: translateX(-255px) scale(0.85); } .showcase-card.next-1 { transform: translateX(255px) scale(0.85); }
      .showcase-card.prev-2 { transform: translateX(-480px) scale(0.68); } .showcase-card.next-2 { transform: translateX(480px) scale(0.68); }
    }
    @media (max-width: 768px) {
      .mobile-menu-btn { display: block; }
      .nav-center { display: none; flex-direction: column; position: absolute; top: 100%; left: 0; width: 100%; background-color: #ffffff; padding: 20px 5%; box-shadow: 0 10px 20px rgba(0,0,0,0.1); border-top: 1px solid #f0f0f0; z-index: 999; }
      .nav-center.mobile-active { display: flex; } .nav-links { flex-direction: column; gap: 16px; }
      .nav-links li#enrollNavItem.mobile-show { display: block !important; }
      .nav-right .logout-btn { display: none; } .mobile-only-link { display: block; } .mobile-only-link a { color: #f97316 !important; font-weight: 700; }
      .profile-name-string { display: none; }
      .carousel-section { min-height: auto; padding: 40px 0 50px 0; }
      .corner-bracket { display: none; }
      .carousel-container { height: 380px; } .showcase-card { width: 220px; }
      .showcase-card.active { transform: translateX(0) scale(1.05); }
      .showcase-card.prev-1 { transform: translateX(-120px) scale(0.85); } .showcase-card.next-1 { transform: translateX(120px) scale(0.85); }
      .showcase-card.prev-2 { transform: translateX(-220px) scale(0.65); opacity: 0.1; } .showcase-card.next-2 { transform: translateX(220px) scale(0.65); opacity: 0.1; }
      .carousel-btn { padding: 8px; opacity: 0.7; } .carousel-btn svg { width: 28px; height: 28px; }
      .left-btn { left: 1%; } .right-btn { right: 1%; }
      .footer-content { flex-direction: column; text-align: center; } .footer-right { align-items: center; }
    }
    @media (max-width: 480px) {
      .carousel-container { height: 280px; } .showcase-card { width: 160px; }
      .showcase-card.active { transform: translateX(0) scale(1.05); }
      .showcase-card.prev-1 { transform: translateX(-90px) scale(0.85); } .showcase-card.next-1 { transform: translateX(90px) scale(0.85); }
      .showcase-card.prev-2, .showcase-card.next-2 { opacity: 0; pointer-events: none;}
      .carousel-btn svg { width: 22px; height: 22px; }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="logo-area"><div class="logo">ECE</div></div>
    <div class="nav-center" id="navCenter">
      <ul class="nav-links" id="navLinks">
        <li><a href="#" class="active">Home</a></li>
        <li><a href="merch.html">Shop</a></li>
        <li><a href="http://58.71.15.10/" target="_blank">Student Portal</a></li>
        <li><a href="#">Explore</a></li>
        <li><a href="#">About Us</a></li>
        <li id="enrollNavItem"><a href="enroll.html">Enroll</a></li>
        <li class="mobile-only-link"><a href="#" id="mobileLogoutBtn">Logout</a></li>
      </ul>
    </div>
    <div class="nav-right">
      <a href="profile.html" id="profileLink" class="user-profile-widget" style="text-decoration: none;">
        <div class="avatar-circle" id="avatarLetter">U</div>
        <div class="user-meta-text">
          <span class="profile-name-string" id="profileName">Loading...</span>
          <span class="badge-pill" id="roleBadge">Student</span>
        </div>
      </a>
      <button class="logout-btn" id="logoutBtn">Logout</button>
      <button class="mobile-menu-btn" id="mobileMenuBtn">
        <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
    </div>
  </header>

  <main class="dashboard-wrapper">
    <div class="dashboard-content">
      <div class="hero-section">
        <h1 id="welcome-name">Welcome, Student!</h1>
        <div id="welcome-year" class="student-meta">Accessing Engineering Portal...</div>
      </div>

      <section class="carousel-section">
        <div class="corner-bracket top-left"><svg viewBox="0 0 24 24"><polyline points="12 3 3 3 3 12"></polyline></svg></div>
        <div class="corner-bracket top-right"><svg viewBox="0 0 24 24"><polyline points="12 3 21 3 21 12"></polyline></svg></div>
        <div class="corner-bracket bottom-left"><svg viewBox="0 0 24 24"><polyline points="3 12 3 21 12 21"></polyline></svg></div>
        <div class="corner-bracket bottom-right"><svg viewBox="0 0 24 24"><polyline points="21 12 21 21 12 21"></polyline></svg></div>

        <div class="carousel-wrapper">
          <button class="carousel-btn left-btn" id="prevBtn"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></button>

          <div class="carousel-container" id="carouselContainer">
             </div>

          <button class="carousel-btn right-btn" id="nextBtn"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
        </div>

        <div class="carousel-dots" id="carouselDots">
          <button class="dot active" data-index="0"></button>
          <button class="dot" data-index="1"></button>
          <button class="dot" data-index="2"></button>
          <button class="dot" data-index="3"></button>
          <button class="dot" data-index="4"></button>
        </div>
      </section>

    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <div class="footer-left">
        <div class="footer-logo">Contact Us</div>
        <p>&copy; 2026 Department of Electronics Engineering - WMSU. All rights reserved.</p>
      </div>
      <div class="footer-right">
        <div class="footer-links">
          <a href="https://www.facebook.com/JIECEPWMSU" class="footer-link"><svg viewBox="0 0 24 24"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c4.56-.93 8-4.96 8-9.75z"/></svg> Facebook</a>
          <a href="mailto:jiecepwmsu@gmail.com" class="footer-link"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg> jiecepwmsu@gmail.com</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <script>
    const { createClient } = supabase;
    const supabaseClient = createClient(
      "https://xxzbuhvilxapebzzkmla.supabase.co",
      "sb_publishable_Bp2vcEqzfxnGDhfrm_0Nqw_ipJ79QDb"
    );

    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const navCenter = document.getElementById('navCenter');
    mobileMenuBtn.addEventListener('click', () => navCenter.classList.toggle('mobile-active'));
    document.addEventListener('click', (e) => { if (!mobileMenuBtn.contains(e.target) && !navCenter.contains(e.target)) navCenter.classList.remove('mobile-active'); });

    let currentSlide = 2;

    async function loadCarouselData() {
      try {
        const { data, error } = await supabaseClient.from('carousel_announcements').select('*').order('id');
        if (error) throw error;
        
        const container = document.getElementById('carouselContainer');
        container.innerHTML = '';

        // Pad data if less than 5 items exist
        let items = data || [];
        while(items.length < 5) items.push({ id: items.length+1, title: 'Blank Slot', subtitle: '-', image_url: '', link_url: '#' });

        items.forEach((item, index) => {
          const imgPath = item.image_url || 'https://via.placeholder.com/400x400?text=No+Image';
          const a = document.createElement('a');
          a.href = item.link_url || '#';
          a.className = 'showcase-card';
          a.dataset.index = index;
          a.innerHTML = `
            <span class="card-corner tl"></span><span class="card-corner tr"></span><span class="card-corner bl"></span><span class="card-corner br"></span>
            <div class="image-container"><img src="${imgPath}" alt="${item.title}"></div>
            <div class="card-meta">
              <h3>${item.title || 'Untitled'}</h3>
              <p>${item.subtitle || ''}</p>
            </div>
          `;
          
          a.addEventListener('click', (e) => {
            if (index !== currentSlide && window.innerWidth > 768) {
              e.preventDefault();
              currentSlide = index;
              updateCarouselDOM();
            }
          });
          container.appendChild(a);
        });

        updateCarouselDOM();
      } catch (err) {
        console.error("Failed loading carousel:", err);
      }
    }

    function updateCarouselDOM() {
      if (window.innerWidth <= 768) return; 
      const cards = document.querySelectorAll('.showcase-card');
      const dots = document.querySelectorAll('.dot');
      const total = cards.length;
      if (total === 0) return;

      cards.forEach((card, i) => {
        card.classList.remove('active', 'prev-1', 'prev-2', 'next-1', 'next-2');
        let offset = i - currentSlide;
        if (offset < -2) offset += total;
        if (offset > 2)  offset -= total;
        if (offset === 0) card.classList.add('active');
        else if (offset === -1) card.classList.add('prev-1');
        else if (offset === 1) card.classList.add('next-1');
        else if (offset === -2) card.classList.add('prev-2');
        else if (offset === 2) card.classList.add('next-2');
      });
      dots.forEach((dot, i) => dot.classList.toggle('active', i === currentSlide));
    }

    document.getElementById('prevBtn').addEventListener('click', () => { currentSlide = currentSlide === 0 ? 4 : currentSlide - 1; updateCarouselDOM(); });
    document.getElementById('nextBtn').addEventListener('click', () => { currentSlide = currentSlide === 4 ? 0 : currentSlide + 1; updateCarouselDOM(); });
    document.querySelectorAll('.dot').forEach(dot => {
      dot.addEventListener('click', () => { currentSlide = parseInt(dot.dataset.index, 10); updateCarouselDOM(); });
    });
    window.addEventListener('resize', updateCarouselDOM);

    function initializeDashboardProtection() {
      supabaseClient.auth.onAuthStateChange(async (event, session) => {
        if (!session) { window.location.href = "loginpage.html"; return; }
        
        const activeUser = session.user;
        let displayedName = "ECE Student";
        let displayedYear = "ECE Department Portal";
        let inferredRole = "Student";

        try {
          const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', activeUser.id).maybeSingle();
          if (activeUser.user_metadata && activeUser.user_metadata.role) inferredRole = activeUser.user_metadata.role;

          if (profile) {
            displayedName = profile.full_name || "ECE Student";
            displayedYear = profile.year_level ? `Enrolled: ${profile.year_level}` : "ECE Department";
            if (profile.year_level === 'First Year') document.getElementById('enrollNavItem').style.display = 'block';
          }

          if (inferredRole.toLowerCase() === 'professor' || inferredRole.toLowerCase() === 'admin') {
            displayedYear = 'Faculty Staff / Admin Access Granted';
            document.getElementById("roleBadge").style.backgroundColor = "#111111";
          } else if (inferredRole.toLowerCase() === 'guest') {
            document.getElementById("roleBadge").style.backgroundColor = "#555555";
            const profileLink = document.getElementById('profileLink');
            if (profileLink) {
              profileLink.removeAttribute('href');
              profileLink.classList.add('profile-widget-disabled');
              profileLink.title = 'Profile page is not available for guest accounts';
            }
          }
        } catch (err) { console.error(err); }

        document.getElementById("profileName").textContent = displayedName;
        document.getElementById("welcome-name").textContent = `Welcome, ${displayedName}!`;
        document.getElementById("roleBadge").textContent = inferredRole;
        document.getElementById("avatarLetter").textContent = displayedName.charAt(0).toUpperCase();
        document.getElementById("welcome-year").textContent = displayedYear;

        // Fetch carousel dynamically
        loadCarouselData();
      });
    }

    window.addEventListener("DOMContentLoaded", initializeDashboardProtection);

    async function performLogout(e) {
      e.preventDefault();
      try {
        await supabaseClient.auth.signOut();
        localStorage.clear(); sessionStorage.clear();
        window.location.href = "loginpage.html";
      } catch (err) { window.location.href = "homepage.html"; }
    }
    document.getElementById('logoutBtn').addEventListener('click', performLogout);
    document.getElementById('mobileLogoutBtn').addEventListener('click', performLogout);

  </script>
</body>
</html>
